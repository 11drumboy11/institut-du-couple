<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portefeuille de Compétences — C Concept&Dev</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --vert:#C8D0C3;--beige:#D8CDBB;--sable:#E6D7C3;--mer:#8FAFB1;--merd:#6d9496;--merl:#b5cfd1;
  --blanc:#FFF;--txt:#333;--txtl:#777;--txtu:#aaa;
  --danger:#c0392b;--success:#27ae60;--warn:#e67e22;--info:#2980b9;
  --sh:0 4px 20px rgba(0,0,0,.1);--shs:0 2px 8px rgba(0,0,0,.08);
  --r:14px;--rs:8px;--tr:all .25s cubic-bezier(.4,0,.2,1);
  --ff:'Montserrat','Segoe UI',sans-serif;--fd:'Playfair Display',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--ff);background:linear-gradient(160deg,#f0ebe4,var(--beige) 50%,#ddd5c7);color:var(--txt);min-height:100vh;line-height:1.65;font-size:15px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--sable)}::-webkit-scrollbar-thumb{background:var(--mer);border-radius:3px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border:none;border-radius:var(--rs);font-family:inherit;font-size:.88em;font-weight:600;cursor:pointer;transition:var(--tr);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,var(--mer),var(--merd));color:var(--blanc);box-shadow:0 4px 12px rgba(109,148,150,.35)}
.btn-p:hover{box-shadow:0 6px 20px rgba(109,148,150,.45);transform:translateY(-1px)}
.btn-s{background:var(--blanc);color:var(--txt);border:2px solid var(--vert)}.btn-s:hover{background:var(--sable)}
.btn-g{background:transparent;color:var(--merd);padding:7px 12px}.btn-g:hover{background:rgba(143,175,177,.1)}
.btn-d{background:var(--blanc);color:var(--danger);border:2px solid var(--danger)}.btn-d:hover{background:var(--danger);color:var(--blanc)}
.btn-sm{padding:7px 14px;font-size:.82em}.btn-xs{padding:5px 10px;font-size:.78em;border-radius:5px}

.tag{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:.8em;font-weight:500;cursor:pointer;transition:var(--tr);border:2px solid #e0dbd4;background:#f0ede8;color:var(--txt);user-select:none}
.tag:hover{border-color:var(--mer)}.tag.sel{background:var(--mer);color:var(--blanc);border-color:var(--mer)}

/* === SCREENS === */
.scr{display:none}.scr.on{display:block}
#S_setup.on{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#S_resume.on{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}

.card-setup{background:var(--blanc);border-radius:20px;padding:42px;max-width:580px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.14)}
.card-setup .logo{text-align:center;margin-bottom:28px}
.card-setup .logo h1{font-family:var(--fd);color:var(--mer);font-size:1.9em;margin-bottom:3px}
.card-setup .logo p{color:var(--txtl);font-size:.9em}
.ff{margin-bottom:16px}.ff label{display:block;font-weight:600;font-size:.86em;color:var(--txt);margin-bottom:5px}
.ff input,.ff select{width:100%;padding:12px 15px;border:2px solid #e8e4de;border-radius:var(--rs);font-family:inherit;font-size:.95em;transition:var(--tr)}
.ff input:focus,.ff select:focus{outline:none;border-color:var(--mer);box-shadow:0 0 0 3px rgba(143,175,177,.15)}
.setup-priv{background:var(--sable);border-left:4px solid var(--mer);border-radius:var(--rs);padding:13px 15px;font-size:.8em;color:var(--txtl);line-height:1.7;margin:18px 0}

/* RESUME */
.card-resume{background:var(--blanc);border-radius:20px;padding:42px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.14);text-align:center}
.card-resume h1{font-family:var(--fd);color:var(--mer);font-size:1.5em;margin-bottom:6px}
.re-meta{color:var(--txtl);font-size:.88em;margin-bottom:18px}
.re-sug{text-align:left;background:var(--sable);border-radius:var(--rs);padding:15px;border-left:4px solid var(--mer);margin:15px 0}
.re-sug h3{font-size:.88em;color:var(--merd);margin-bottom:6px}
.re-sug ul{list-style:none}.re-sug li{padding:6px 0;font-size:.86em;border-bottom:1px solid rgba(0,0,0,.04);cursor:pointer;transition:var(--tr)}.re-sug li:hover{color:var(--merd);padding-left:6px}

/* APP */
.ah{background:var(--blanc);border-bottom:3px solid var(--vert);padding:10px 22px;position:sticky;top:0;z-index:100;box-shadow:var(--shs)}
.ah-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ah-br{display:flex;align-items:center;gap:9px}
.ah-br h1{font-size:1em;font-weight:700;color:var(--mer)}
.ah-badge{font-size:.75em;color:var(--blanc);background:var(--mer);padding:2px 9px;border-radius:11px;font-weight:500}
.ah-act{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

.pg{background:var(--blanc);padding:5px 22px;border-bottom:1px solid #f0ede8}
.pg-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px}
.pg-t{flex:1;height:5px;background:#f0ede8;border-radius:3px;overflow:hidden}
.pg-f{height:100%;background:linear-gradient(90deg,var(--mer),var(--success));border-radius:3px;transition:width .5s;width:0%}
.pg-l{font-size:.73em;font-weight:600;color:var(--merd);white-space:nowrap}

.ab{max-width:1120px;margin:0 auto;padding:20px 18px 80px;display:flex;gap:20px}
.sb{width:240px;flex-shrink:0;position:sticky;top:108px;align-self:flex-start;max-height:calc(100vh - 128px);overflow-y:auto}
.nl{list-style:none;background:var(--blanc);border-radius:var(--r);box-shadow:var(--shs);overflow:hidden}
.ni{padding:11px 14px;cursor:pointer;font-size:.82em;font-weight:500;color:var(--txt);border-left:4px solid transparent;transition:var(--tr);display:flex;align-items:center;gap:7px;border-bottom:1px solid rgba(0,0,0,.03)}
.ni:hover{background:#faf8f5}.ni.on{background:linear-gradient(90deg,rgba(143,175,177,.08),transparent);border-left-color:var(--mer);color:var(--merd);font-weight:600}
.ns{width:15px;height:15px;border-radius:50%;border:2px solid #e0dbd4;display:flex;align-items:center;justify-content:center;font-size:.55em;flex-shrink:0;transition:var(--tr)}
.ni.done .ns{background:var(--success);border-color:var(--success);color:var(--blanc)}
.ni.wip .ns{background:var(--warn);border-color:var(--warn);color:var(--blanc)}

.ca{flex:1;min-width:0}
.sp{display:none;background:var(--blanc);border-radius:var(--r);box-shadow:var(--sh);padding:32px;animation:fu .3s ease}
.sp.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.sh2{margin-bottom:18px;padding-bottom:15px;border-bottom:2px solid var(--sable)}
.st{color:var(--mer);font-size:1.35em;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:9px}
.sdsc{color:var(--txtl);font-size:.88em;line-height:1.7}

/* FIELDS — LARGE zones */
.fg{margin-bottom:18px}.fg>label{display:block;font-weight:600;font-size:.88em;color:var(--txt);margin-bottom:5px}
.fg .hint{font-size:.78em;color:var(--txtu);font-style:italic;margin-bottom:4px}
textarea,input[type="text"],input[type="date"],select{width:100%;padding:12px 15px;border:2px solid #e8e4de;border-radius:var(--rs);font-family:inherit;font-size:.95em;transition:var(--tr);background:var(--blanc);line-height:1.6}
textarea{min-height:140px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--mer);box-shadow:0 0 0 3px rgba(143,175,177,.15)}
textarea.large{min-height:200px}

/* RATING */
.rg{display:flex;gap:5px;flex-wrap:wrap}
.rb{padding:7px 14px;border:2px solid #e8e4de;border-radius:18px;background:var(--blanc);cursor:pointer;font-family:inherit;font-size:.83em;font-weight:500;transition:var(--tr)}
.rb:hover{border-color:var(--mer)}.rb.sel{background:var(--mer);border-color:var(--mer);color:var(--blanc)}

/* TAG CLOUD */
.tc{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}

/* RELANCE */
.relance{background:linear-gradient(135deg,#fef9f0,#fef5e7);border:1px solid #f5e6c8;border-left:4px solid var(--warn);border-radius:var(--rs);padding:12px 15px;margin-top:8px;font-size:.84em;display:none;animation:fu .3s ease}
.relance.show{display:block}
.relance .rl-t{font-weight:600;color:var(--warn);margin-bottom:6px;font-size:.9em}
.relance .rl-q{padding:4px 0;cursor:pointer;color:var(--txt);transition:var(--tr);border-bottom:1px solid rgba(0,0,0,.04)}
.relance .rl-q:hover{color:var(--warn);padding-left:5px}.relance .rl-q:last-child{border:none}

/* ENTRY CARDS */
.ec{background:var(--blanc);border:1px solid #ede8e1;border-left:4px solid var(--mer);border-radius:var(--rs);margin-bottom:10px;overflow:hidden;transition:var(--tr)}
.ec.coll .eb2{display:none}
.et{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;background:linear-gradient(135deg,#fafaf8,#f5f0eb);border-bottom:1px solid #f0ede8;transition:var(--tr)}
.et:hover{background:#f0ede8}
.ec-ch{font-size:.7em;color:var(--txtl);transition:transform .2s}.ec.coll .ec-ch{transform:rotate(-90deg)}
.ec-num{font-weight:700;color:var(--mer);font-size:.86em}
.ec-sum{flex:1;font-size:.83em;color:var(--txtl);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ec-tags{display:flex;gap:3px}
.ec-tb{padding:2px 6px;border-radius:9px;font-size:.68em;cursor:pointer;border:1.5px solid;font-weight:600;transition:var(--tr);opacity:.35}
.ec-tb.act{opacity:1}
.ec-tb.ti{color:var(--warn);border-color:var(--warn)}.ec-tb.ti.act{background:#fef5e7}
.ec-tb.td{color:var(--info);border-color:var(--info)}.ec-tb.td.act{background:#ebf5fb}
.ec-tb.tk{color:var(--success);border-color:var(--success)}.ec-tb.tk.act{background:#eafaf1}
.ec-act{display:flex;gap:3px}
.ec-ab{background:none;border:none;cursor:pointer;font-size:.95em;padding:2px 4px;border-radius:3px;transition:var(--tr);color:var(--txtl)}
.ec-ab:hover{background:#f0ede8}.ec-ab.rm:hover{color:var(--danger)}
.eb2{padding:18px}.eb2 .fg{margin-bottom:14px}

/* DEPTH TABS */
.dt{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid #f0ede8}
.dt-t{padding:7px 14px;font-size:.82em;font-weight:600;cursor:pointer;color:var(--txtl);border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--tr)}
.dt-t:hover{color:var(--txt)}.dt-t.on{color:var(--merd);border-bottom-color:var(--mer)}
.dc{display:none;animation:fu .2s ease}.dc.on{display:block}

.ae-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;border:2px dashed var(--vert);border-radius:var(--rs);background:transparent;color:var(--merd);font-family:inherit;font-size:.88em;font-weight:600;cursor:pointer;transition:var(--tr);margin-top:8px}
.ae-btn:hover{background:rgba(143,175,177,.06);border-color:var(--mer)}

/* SYNTHESIS */
.sy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sy-cell{background:linear-gradient(135deg,#faf8f5,#f5f0eb);border-radius:var(--rs);padding:14px;border-left:4px solid var(--mer)}
.sy-cell h4{font-size:.83em;font-weight:700;color:var(--merd);margin-bottom:6px}

/* FIL ROUGE */
.fr-panel{background:linear-gradient(135deg,#fef5e7,#fef9f0);border:1px solid #f5e6c8;border-radius:var(--r);padding:18px;margin-bottom:16px}
.fr-panel h3{font-size:.92em;color:var(--warn);font-weight:700;margin-bottom:8px}
.fr-item{font-size:.86em;padding:4px 0;line-height:1.6;color:var(--txt)}

/* INSIGHTS */
.ip{background:linear-gradient(135deg,#ebf5fb,#f0f7fb);border:1px solid #c8e1ee;border-radius:var(--r);padding:18px;margin-bottom:16px}
.ip h3{font-size:.92em;color:var(--info);font-weight:700;margin-bottom:8px}
.ip-item{font-size:.86em;padding:4px 0;line-height:1.6}
.ip-kw{display:inline-block;background:rgba(41,128,185,.1);color:var(--info);padding:1px 7px;border-radius:9px;font-size:.85em;font-weight:600;margin:0 2px}

/* DOCUMENTS / PREUVES */
.doc-zone{margin-top:10px}
.doc-drop{border:2px dashed var(--vert);border-radius:var(--rs);padding:22px;text-align:center;cursor:pointer;transition:var(--tr);color:var(--txtl);font-size:.88em;background:rgba(143,175,177,.03)}
.doc-drop:hover,.doc-drop.over{border-color:var(--mer);background:rgba(143,175,177,.08)}
.doc-drop input{display:none}
.doc-list{margin-top:8px}
.doc-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#faf8f5;border-radius:var(--rs);margin-bottom:5px;border:1px solid #ede8e1;font-size:.85em}
.doc-icon{font-size:1.2em}
.doc-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.doc-size{color:var(--txtu);font-size:.8em}
.doc-rm{background:none;border:none;cursor:pointer;color:var(--danger);font-size:1em;padding:2px 5px;border-radius:3px;transition:var(--tr)}
.doc-rm:hover{background:rgba(192,57,43,.1)}

/* ROME */
.rome-field{display:flex;gap:8px;align-items:flex-start}
.rome-field input{flex:1}
.rome-link{font-size:.78em;color:var(--info);text-decoration:underline;cursor:pointer;white-space:nowrap;padding-top:14px}

.sn{display:flex;justify-content:space-between;margin-top:22px;padding-top:15px;border-top:2px solid var(--sable)}

/* MODALS */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--blanc);border-radius:var(--r);padding:32px;max-width:440px;width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.14)}
.modal h2{color:var(--mer);margin-bottom:8px;font-size:1.15em}.modal p{color:var(--txtl);margin-bottom:18px;font-size:.9em}
.m-spin{width:32px;height:32px;border:4px solid var(--beige);border-top-color:var(--mer);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .ab{flex-direction:column}.sb{width:100%;position:static;max-height:none}
  .nl{display:flex;overflow-x:auto}.ni{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;font-size:.78em;padding:9px 11px}
  .ni.on{border-bottom-color:var(--mer);border-left:none}.sp{padding:20px}
  .sy-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .card-setup{padding:26px 16px}.card-setup .logo h1{font-size:1.4em}
  .ah-in{flex-direction:column;align-items:flex-start}.st{font-size:1.15em}
  .sn{flex-direction:column;gap:7px}.sn .btn{width:100%;justify-content:center}
}

/* PDF */
.pz{font-family:'Montserrat',sans-serif;color:#333;line-height:1.5;font-size:12px}
.pz .pc{text-align:center;padding:45px 28px;border-bottom:4px solid var(--mer);page-break-after:always}
.pz .pc h1{font-family:var(--fd);color:var(--mer);font-size:24px;margin-bottom:3px}
.pz .pm{background:#f9f7f4;display:inline-block;padding:14px 28px;border-radius:7px;border-left:4px solid var(--mer);text-align:left;margin:18px 0;font-size:12px}
.pz .ptoc{page-break-after:always;padding:28px}.pz .ptoc h2{color:var(--mer);font-size:15px;margin-bottom:12px;border-bottom:2px solid var(--vert);padding-bottom:5px}
.pz .pti{padding:4px 0;border-bottom:1px dotted #ddd;font-size:12px}
.pz .ps{padding:12px 28px;page-break-inside:avoid;margin-bottom:8px}
.pz .ps h2{color:var(--mer);font-size:14px;border-bottom:2px solid var(--vert);padding-bottom:3px;margin-bottom:8px}
.pz .pf{margin-bottom:6px}.pz .pl{font-weight:600;font-size:10px;color:var(--merd);margin-bottom:1px}
.pz .pv{font-size:11px;background:#f9f7f4;padding:5px 9px;border-radius:3px;border-left:3px solid var(--mer);white-space:pre-wrap;min-height:14px}
.pz .pe{border:1px solid #ddd;border-radius:4px;padding:8px;margin-bottom:6px;page-break-inside:avoid}
.pz .pet{font-weight:600;color:var(--mer);font-size:11px;margin-bottom:4px}
.pz .pfr{text-align:center;font-size:9px;color:#aaa;border-top:1px solid #ddd;padding-top:6px;margin-top:20px}
.pz .pnarr{background:#faf8f5;border-left:4px solid var(--warn);padding:10px 14px;border-radius:4px;margin:10px 0;font-size:11px;line-height:1.6;font-style:italic;color:#555}
.pz .pdocs{font-size:10px;color:#555;margin-top:4px}
</style>
</head>
<body>

<div id="S_setup" class="scr on">
  <div class="card-setup">
    <div class="logo"><h1>Portefeuille de Compétences</h1><p>C Concept&Dev — Bilan de Compétences</p></div>
    <div class="ff"><label>Nom complet du bénéficiaire</label><input type="text" id="su-nom" placeholder="Prénom NOM" required></div>
    <div class="ff"><label>Consultant accompagnant</label><input type="text" id="su-consultant"></div>
    <div class="ff"><label>Date de début du bilan</label><input type="date" id="su-debut"></div>
    <div class="ff"><label>Date de fin prévue</label><input type="date" id="su-fin"></div>
    <div class="ff"><label>Contexte</label>
      <select id="su-ctx">
        <option value="">— Choisir —</option>
        <option value="salarie">Salarié(e) en poste</option>
        <option value="recherche">Recherche d'emploi</option>
        <option value="reconversion">Reconversion professionnelle</option>
        <option value="creation">Création d'activité</option>
        <option value="evolution">Évolution interne</option>
        <option value="formation">Formation / VAE</option>
        <option value="autre">Autre</option>
      </select>
    </div>
    <div class="setup-priv">🔒 <strong>Confidentialité</strong> : données stockées localement dans votre navigateur. Aucune transmission. Export JSON/PDF à tout moment.</div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-p" style="flex:1" onclick="startApp()">▶ Commencer</button>
      <button class="btn btn-s" style="flex:1" onclick="tryResume()">↻ Reprendre</button>
    </div>
    <div style="text-align:center;margin-top:10px"><button class="btn btn-g btn-sm" onclick="importJSON()">📥 Importer JSON</button></div>
  </div>
</div>

<div id="S_resume" class="scr">
  <div class="card-resume">
    <h1>Reprendre votre parcours</h1>
    <p class="re-meta" id="re-meta"></p>
    <div class="re-sug" id="re-sug"></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:15px">
      <button class="btn btn-p" onclick="doResume()">▶ Reprendre</button>
      <button class="btn btn-s" onclick="showScr('S_setup')">↺ Nouveau</button>
    </div>
  </div>
</div>

<div id="S_app" class="scr">
  <header class="ah"><div class="ah-in">
    <div class="ah-br"><h1>Portefeuille de Compétences</h1><span class="ah-badge" id="u-badge"></span></div>
    <div class="ah-act">
      <button class="btn btn-xs btn-g" onclick="saveNow()">💾 Sauver</button>
      <button class="btn btn-xs btn-g" onclick="exportJSON()">📦 JSON</button>
      <button class="btn btn-xs btn-p" onclick="exportPDF()">📄 PDF</button>
      <button class="btn btn-xs btn-g" onclick="confirmReset()" style="color:var(--danger)">🗑</button>
    </div>
  </div></header>
  <div class="pg"><div class="pg-in"><div class="pg-t"><div class="pg-f" id="pg-f"></div></div><span class="pg-l" id="pg-l">0%</span></div></div>
  <div class="ab"><nav class="sb"><ul class="nl" id="nav"></ul></nav><main class="ca" id="ca"></main></div>
</div>

<div class="modal-bg" id="pdf-modal"><div class="modal"><div class="m-spin"></div><h2>Génération du PDF</h2><p id="pdf-st">Préparation…</p></div></div>
<div id="pdf-z" style="position:absolute;left:-9999px;top:0;width:210mm"></div>
<input type="file" id="f-imp" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const SK='pcv4';
let D={};
let curSec=0;

// ========== RELANCE ENGINE ==========
const RELANCE=[
  {t:['fatigu','épuis','usure','burn','ras le bol','lassitude','ennui'],q:['Qu\'est-ce qui vous fatigue le plus concrètement ?','Depuis quand ressentez-vous cela ?','Est-ce lié aux conditions ou au contenu du travail ?']},

function findRelances(text){if(!text||text.length<15)return null;const l=text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');for(const r of RELANCE)for(const t of r.t)if(l.includes(t))return r.q;return null}

const THEMES=[
  {th:'Accompagnement & transmission',w:['accompagn','former','transmettre','enseign','coach','mentor','tutorat','pédagog']},
  {th:'Créativité & innovation',w:['créer','innov','imagin','design','concevoir','inventer','artistique']},
  {th:'Organisation & rigueur',w:['organis','planifi','structur','rigoureu','méthod','process','cadrer']},
  {th:'Relation & écoute',w:['écoute','empathi','relation','communiqu','échang','dialog','humain','lien']},
  {th:'Autonomie & indépendance',w:['autonom','indépendan','liberté','responsab','initiative','décid']},
  {th:'Sens & engagement',w:['sens','utilité','valeur','engag','contribu','impact','servir']},
  {th:'Technique & expertise',w:['technique','expert','spéciali','maîtris','compéten','savoir-faire']},
  {th:'Management & leadership',w:['manag','diriger','leader','équipe','pilot','coordonn','encadre']},
];
function analyzeFilRouge(){
  const all=Object.entries(D.data||{}).filter(([k,v])=>typeof v==='string'&&!k.startsWith('_')&&v.length>5).map(([,v])=>v).join(' ');
  if(all.length<50)return{themes:[],narrative:'',tags:[]};
  const l=all.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const scored=THEMES.map(tp=>{let c=0;tp.w.forEach(w=>{const m=l.match(new RegExp(w,'gi'));if(m)c+=m.length});return{th:tp.th,c}}).filter(t=>t.c>=2).sort((a,b)=>b.c-a.c);
  let n='';
  if(scored.length>=2){n=`Vos réponses montrent une orientation forte vers ${scored[0].th.toLowerCase()} et ${scored[1].th.toLowerCase()}.`;if(scored[2])n+=` On note également une sensibilité à ${scored[2].th.toLowerCase()}.`;n+=' Ces tendances constituent un fil conducteur précieux pour orienter votre projet.';}
  else if(scored.length===1)n=`Un thème revient clairement : ${scored[0].th.toLowerCase()}. C'est un point d'ancrage important.`;
  const tags=Object.entries(D.data||{}).filter(([k])=>k.includes('__tg__')).map(([,v])=>v).join('||').split('||').filter(Boolean);
  return{themes:scored.slice(0,4),narrative:n,tags};
}

// ========== UTILS ==========
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escBr(s){return esc(s).replace(/\n/g,'<br>')}
function fmtD(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}}
function gv(k){return D.data?.[k]||''}
function sv(k,v){if(!D.data)D.data={};D.data[k]=v}
function gList(id){const k='_l_'+id;if(!D.data[k])D.data[k]=[];return D.data[k]}
function showScr(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on')}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function fmtSize(b){if(b<1024)return b+'o';if(b<1048576)return(b/1024).toFixed(1)+'Ko';return(b/1048576).toFixed(1)+'Mo'}
function fileIcon(name){const ext=(name.split('.').pop()||'').toLowerCase();const m={'pdf':'📄','doc':'📝','docx':'📝','jpg':'🖼️','jpeg':'🖼️','png':'🖼️','gif':'🖼️','webp':'🖼️','xls':'📊','xlsx':'📊','ppt':'📽️','pptx':'📽️','txt':'📃','csv':'📊','zip':'📦','rar':'📦'};return m[ext]||'📎'}

function startApp(){
  const nom=document.getElementById('su-nom').value.trim();
  if(!nom){document.getElementById('su-nom').focus();return}
  D={meta:{nom,consultant:document.getElementById('su-consultant').value.trim(),date_debut:document.getElementById('su-debut').value,date_fin:document.getElementById('su-fin').value,contexte:document.getElementById('su-ctx').value,created:new Date().toISOString()},data:{}};
  SEC.forEach(s=>{if(s.dl)D.data['_l_'+s.dl.id]=[]});
  save();launch();
}

function tryResume(){const s=localStorage.getItem(SK);if(!s){alert('Aucune session trouvée.');return}try{D=JSON.parse(s);showResume()}catch(e){alert('Session corrompue.')}}

function showResume(){
  showScr('S_resume');const m=D.meta||{};
  document.getElementById('re-meta').innerHTML=`<strong>${esc(m.nom)}</strong><br>Dernière activité : ${m.lastSaved?fmtD(m.lastSaved.split('T')[0]):'—'}`;
  let su=[];SEC.forEach((s,i)=>{const c=countFilled(s);if(c.t>0&&c.f===0)su.push({i,txt:`${s.icon} ${s.title} — pas commencé`});else if(c.t>0&&c.f<c.t)su.push({i,txt:`${s.icon} ${s.title} — ${Math.round(c.f/c.t*100)}%`})});
  document.getElementById('re-sug').innerHTML=su.length?`<h3>💡 Où reprendre ?</h3><ul>${su.slice(0,5).map(s=>`<li onclick="doResumeTo(${s.i})">${s.txt}</li>`).join('')}</ul>`:'<h3>✅ Sections remplies</h3>';
}
function doResume(){launch()}
function doResumeTo(i){launch();navTo(i)}

function launch(){
  showScr('S_app');document.getElementById('u-badge').textContent=D.meta.nom;
  buildNav();buildAll();navTo(0);updateProg();
}

// ========== BUILD ==========
function buildAll(){
  const ca=document.getElementById('ca');
  ca.innerHTML=SEC.map((sec,idx)=>{
    let c='';
    if(['synthese','persp','plan'].includes(sec.id))c+=`<div class="fr-panel" id="fr-${sec.id}" style="display:none"></div>`;
    if(['synthese','persp'].includes(sec.id))c+=`<div class="ip" id="ip-${sec.id}" style="display:none"></div>`;
    if(sec.tags)c+=buildTags(sec.id,sec.tags);
    if(sec.layout==='synth')c+=buildSynth(sec);
    if(sec.dl)c+=buildDL(sec);
    if(sec.fields)sec.fields.forEach(f=>{c+=buildF(sec.id,f)});
    const prev=idx>0?`<button class="btn btn-s" onclick="navTo(${idx-1})">← ${SEC[idx-1].title}</button>`:'<span></span>';
    const next=idx<SEC.length-1?`<button class="btn btn-p" onclick="navTo(${idx+1})">${SEC[idx+1].title} →</button>`:`<button class="btn btn-p" onclick="exportPDF()">📄 Exporter PDF</button>`;
    return `<div class="sp" data-sec="${sec.id}"><div class="sh2"><h2 class="st">${sec.icon} ${sec.title}</h2><p class="sdsc">${sec.desc}</p></div>${c}<div class="sn">${prev}${next}</div></div>`;
  }).join('');
  attachL(ca);updateInsights();
}

function buildF(sid,f){
  const key=`${sid}__${f.id}`;const hint=f.hint?`<p class="hint">${f.hint}</p>`:'';
  let h=`<div class="fg"><label>${f.label}</label>${hint}`;
  if(f.type==='rating'){const v=gv(key);h+=`<div class="rg" data-key="${key}">${f.opts.map(o=>`<button type="button" class="rb${v===o?' sel':''}" onclick="clickR(this,'${key}','${esc(o)}')">${o}</button>`).join('')}</div>`;}
  else if(f.type==='ta')h+=`<textarea data-key="${key}" rows="${f.rows||6}" placeholder="${f.ph||''}">${esc(gv(key))}</textarea>`;
  else if(f.type==='rome')h+=`<div class="rome-field"><input type="text" data-key="${key}" placeholder="Ex: K2112" value="${esc(gv(key))}"><a class="rome-link" href="https://candidat.francetravail.fr/marche-du-travail/fichemetierrome" target="_blank" rel="noopener">🔍 Rechercher sur France Travail</a></div>`;
  else h+=`<input type="text" data-key="${key}" placeholder="${f.ph||''}" value="${esc(gv(key))}">`;
  h+=`<div class="relance" id="rl-${key}"></div></div>`;
  return h;
}

function buildTags(sid,ts){
  const key=`${sid}__tg__${ts.id}`;const sel=(gv(key)||'').split('||').filter(Boolean);
  let h=`<div class="fg"><label>${ts.title}</label>`;
  if(ts.hint)h+=`<p class="hint">${ts.hint}</p>`;
  h+=`<div class="tc" data-tgk="${key}">${ts.presets.map(t=>`<span class="tag${sel.includes(t)?' sel':''}" onclick="tgTog(this,'${key}')">${t}</span>`).join('')}</div>`;
  h+=`<div style="display:flex;gap:6px;margin-top:5px"><input type="text" id="tg-c-${ts.id}" placeholder="Ajouter…" style="flex:1;padding:8px 12px;font-size:.86em"><button class="btn btn-xs btn-s" onclick="tgAdd('${sid}','${ts.id}')">+</button></div></div>`;
  return h;
}
function tgTog(el,key){el.classList.toggle('sel');collectTags(key);dSave()}
function tgAdd(sid,tsId){const inp=document.getElementById(`tg-c-${tsId}`);const v=inp.value.trim();if(!v)return;const key=`${sid}__tg__${tsId}`;const cl=document.querySelector(`[data-tgk="${key}"]`);const sp=document.createElement('span');sp.className='tag sel';sp.textContent=v;sp.onclick=function(){tgTog(this,key)};cl.appendChild(sp);inp.value='';collectTags(key);dSave()}
function collectTags(key){const cl=document.querySelector(`[data-tgk="${key}"]`);if(!cl)return;sv(key,[...cl.querySelectorAll('.tag.sel')].map(t=>t.textContent).join('||'))}

function buildSynth(sec){
  return `<div class="sy-grid">${sec.sf.map(f=>`<div class="sy-cell"><h4>${f.label}</h4><textarea data-key="${sec.id}__${f.id}" rows="5" placeholder="Éléments significatifs…">${esc(gv(sec.id+'__'+f.id))}</textarea></div>`).join('')}</div>`;
}

// ========== DYNAMIC LISTS ==========
function buildDL(sec){
  const dl=sec.dl;const entries=gList(dl.id);
  let h=`<div class="dl" id="dl-${dl.id}">`;
  for(let i=0;i<entries.length;i++)h+=buildEC(sec,i);
  h+=`</div><button type="button" class="ae-btn" onclick="addE('${sec.id}','${dl.id}')">${dl.add}</button>`;
  return h;
}

function buildEC(sec,idx){
  const dl=sec.dl;const lid=dl.id;
  const coll=gv(`_co_${lid}_${idx}`)?'coll':'';
  const sf=(dl.fields||dl.depths?.[0]?.fields)?.[0];
  const sk=sf?`${lid}__${idx}__${sf.id}`:'';const sv2=sk?gv(sk):'';
  const tags=gv(`_tg_${lid}_${idx}`)||'';
  let fh='';
  if(dl.depths){
    fh+=`<div class="dt">${dl.depths.map((d,di)=>`<div class="dt-t${di===0?' on':''}" onclick="swDep(this,${di},'${lid}_${idx}')">${d.label}</div>`).join('')}</div>`;
    dl.depths.forEach((d,di)=>{fh+=`<div class="dc${di===0?' on':''}" data-dep="${lid}_${idx}_${di}">${d.fields.map(f=>buildEF(lid,idx,f)).join('')}</div>`});
  } else dl.fields.forEach(f=>{fh+=buildEF(lid,idx,f)});
  // Document upload zone
  if(dl.hasDocUpload)fh+=buildDocZone(lid,idx);
  return `<div class="ec ${coll}" data-e="${lid}-${idx}"><div class="et" onclick="tgEC(this)"><span class="ec-ch">▼</span><span class="ec-num">${dl.et} n°${idx+1}</span><span class="ec-sum">${esc(sv2).substring(0,45)||'—'}</span><div class="ec-tags"><span class="ec-tb ti${tags.includes('imp')?' act':''}" onclick="event.stopPropagation();tgET(this,'${lid}',${idx},'imp')" title="Important">★</span><span class="ec-tb td${tags.includes('deep')?' act':''}" onclick="event.stopPropagation();tgET(this,'${lid}',${idx},'deep')" title="À approfondir">⊕</span><span class="ec-tb tk${tags.includes('keep')?' act':''}" onclick="event.stopPropagation();tgET(this,'${lid}',${idx},'keep')" title="À garder">✓</span></div><div class="ec-act"><button class="ec-ab" onclick="event.stopPropagation();dupE('${sec.id}','${lid}',${idx})" title="Dupliquer">⧉</button><button class="ec-ab rm" onclick="event.stopPropagation();rmE('${sec.id}','${lid}',${idx})" title="Supprimer">✕</button></div></div><div class="eb2">${fh}</div></div>`;
}

function buildEF(lid,idx,f){
  const key=`${lid}__${idx}__${f.id}`;const hint=f.hint?`<p class="hint">${f.hint}</p>`:'';
  let h=`<div class="fg"><label>${f.label}</label>${hint}`;
  if(f.type==='rating'){const v=gv(key);h+=`<div class="rg" data-key="${key}">${f.opts.map(o=>`<button type="button" class="rb${v===o?' sel':''}" onclick="clickR(this,'${key}','${esc(o)}')">${o}</button>`).join('')}</div>`;}
  else if(f.type==='ta')h+=`<textarea data-key="${key}" rows="${f.rows||6}" placeholder="${f.ph||''}">${esc(gv(key))}</textarea>`;
  else if(f.type==='rome')h+=`<div class="rome-field"><input type="text" data-key="${key}" placeholder="Ex: K2112" value="${esc(gv(key))}"><a class="rome-link" href="https://candidat.francetravail.fr/marche-du-travail/fichemetierrome" target="_blank" rel="noopener">🔍 France Travail</a></div>`;
  else h+=`<input type="text" data-key="${key}" placeholder="${f.ph||''}" value="${esc(gv(key))}">`;
  h+=`<div class="relance" id="rl-${key}"></div></div>`;
  return h;
}

// ========== DOCUMENT UPLOAD ==========
function buildDocZone(lid,idx){
  const docsKey=`_docs_${lid}_${idx}`;
  const docs=D.data[docsKey]?JSON.parse(D.data[docsKey]):[];
  return `<div class="doc-zone" id="dz-${lid}-${idx}">
    <label style="font-weight:600;font-size:.88em;display:block;margin-bottom:5px">📎 Documents justificatifs</label>
    <div class="doc-drop" onclick="this.querySelector('input').click()" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');handleDocDrop(event,'${lid}',${idx})">
      Glissez vos fichiers ici ou <strong>cliquez pour importer</strong><br><span style="font-size:.8em;color:var(--txtu)">PDF, images, Word, Excel, certificats… tous formats acceptés</span>
      <input type="file" multiple onchange="handleDocSelect(event,'${lid}',${idx})">
    </div>
    <div class="doc-list" id="docs-${lid}-${idx}">${docs.map((d,di)=>`<div class="doc-item"><span class="doc-icon">${fileIcon(d.name)}</span><span class="doc-name">${esc(d.name)}</span><span class="doc-size">${fmtSize(d.size)}</span><button class="doc-rm" onclick="rmDoc('${lid}',${idx},${di})">✕</button></div>`).join('')}</div>
  </div>`;
}

function handleDocDrop(e,lid,idx){const files=[...e.dataTransfer.files];addDocs(files,lid,idx)}
function handleDocSelect(e,lid,idx){const files=[...e.target.files];addDocs(files,lid,idx);e.target.value=''}

function addDocs(files,lid,idx){
  const docsKey=`_docs_${lid}_${idx}`;
  let docs=D.data[docsKey]?JSON.parse(D.data[docsKey]):[];
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      docs.push({name:f.name,size:f.size,type:f.type,data:ev.target.result});
      D.data[docsKey]=JSON.stringify(docs);
      save();
      refreshDocList(lid,idx);
    };
    reader.readAsDataURL(f);
  });
}

function rmDoc(lid,idx,docIdx){
  const docsKey=`_docs_${lid}_${idx}`;
  let docs=D.data[docsKey]?JSON.parse(D.data[docsKey]):[];
  docs.splice(docIdx,1);
  D.data[docsKey]=JSON.stringify(docs);
  save();refreshDocList(lid,idx);
}

function refreshDocList(lid,idx){
  const docsKey=`_docs_${lid}_${idx}`;
  const docs=D.data[docsKey]?JSON.parse(D.data[docsKey]):[];
  const el=document.getElementById(`docs-${lid}-${idx}`);
  if(el)el.innerHTML=docs.map((d,di)=>`<div class="doc-item"><span class="doc-icon">${fileIcon(d.name)}</span><span class="doc-name">${esc(d.name)}</span><span class="doc-size">${fmtSize(d.size)}</span><button class="doc-rm" onclick="rmDoc('${lid}',${idx},${di})">✕</button></div>`).join('');
}

// ========== ENTRY ACTIONS ==========
function tgEC(top){top.closest('.ec').classList.toggle('coll');const e=top.closest('.ec').dataset.e.split('-');sv(`_co_${e[0]}_${e[1]}`,top.closest('.ec').classList.contains('coll')?'1':'')}
function tgET(el,lid,idx,tag){el.classList.toggle('act');const k=`_tg_${lid}_${idx}`;let t=(gv(k)||'').split(',').filter(Boolean);if(el.classList.contains('act')){if(!t.includes(tag))t.push(tag)}else t=t.filter(x=>x!==tag);sv(k,t.join(','));dSave()}
function swDep(tab,di,ek){tab.parentElement.querySelectorAll('.dt-t').forEach((t,i)=>t.classList.toggle('on',i===di));tab.parentElement.parentElement.querySelectorAll('.dc').forEach(dc=>dc.classList.toggle('on',dc.dataset.dep===`${ek}_${di}`))}

function addE(sid,lid){gList(lid).push({});save();rebuildDL(sid)}
function dupE(sid,lid,idx){
  const sec=SEC.find(s=>s.id===sid);const dl=sec.dl;
  const af=dl.depths?dl.depths.flatMap(d=>d.fields):dl.fields;
  gList(lid).push({});const ni=gList(lid).length-1;
  af.forEach(f=>{const v=gv(`${lid}__${idx}__${f.id}`);if(v)sv(`${lid}__${ni}__${f.id}`,v)});
  save();rebuildDL(sid);
}
function rmE(sid,lid,idx){
  if(!confirm('Supprimer cette entrée ?'))return;
  const sec=SEC.find(s=>s.id===sid);const dl=sec.dl;
  const af=dl.depths?dl.depths.flatMap(d=>d.fields):dl.fields;
  const entries=gList(lid);
  af.forEach(f=>delete D.data[`${lid}__${idx}__${f.id}`]);
  delete D.data[`_tg_${lid}_${idx}`];delete D.data[`_co_${lid}_${idx}`];delete D.data[`_docs_${lid}_${idx}`];
  for(let i=idx+1;i<entries.length;i++){
    af.forEach(f=>{const ok=`${lid}__${i}__${f.id}`,nk=`${lid}__${i-1}__${f.id}`;if(D.data[ok]!==undefined){D.data[nk]=D.data[ok];delete D.data[ok]}});
    ['_tg_','_co_','_docs_'].forEach(p=>{const ok=`${p}${lid}_${i}`,nk=`${p}${lid}_${i-1}`;if(D.data[ok]!==undefined){D.data[nk]=D.data[ok];delete D.data[ok]}});
  }
  entries.splice(idx,1);save();rebuildDL(sid);
}

function rebuildDL(sid){
  const sec=SEC.find(s=>s.id===sid);const idx=SEC.indexOf(sec);
  const panel=document.querySelectorAll('.sp')[idx];if(!panel)return;
  const old=panel.querySelector('.dl');const oldB=panel.querySelector('.ae-btn');
  if(old)old.remove();if(oldB)oldB.remove();
  panel.querySelector('.sn').insertAdjacentHTML('beforebegin',buildDL(sec));
  attachL(panel);updateProg();
}

// ========== LISTENERS ==========
function attachL(c){
  c.querySelectorAll('textarea[data-key],input[data-key]').forEach(el=>{
    el.removeEventListener('input',onInput);el.addEventListener('input',onInput);
    el.removeEventListener('blur',onBlur);el.addEventListener('blur',onBlur);
  });
}
function onInput(e){const k=e.target.dataset.key;if(k)sv(k,e.target.value);dSave();updateProg()}
function onBlur(e){
  const k=e.target.dataset.key;if(!k)return;
  const qs=findRelances(e.target.value);
  const rl=document.getElementById('rl-'+k);
  if(rl&&qs){rl.innerHTML=`<div class="rl-t">💡 Pour aller plus loin…</div>${qs.map(q=>`<div class="rl-q" onclick="insertRl(this,'${k}')">${q}</div>`).join('')}`;rl.classList.add('show')}
  else if(rl)rl.classList.remove('show');
}
function insertRl(el,key){const ta=document.querySelector(`[data-key="${key}"]`);if(ta&&ta.tagName==='TEXTAREA'){ta.value+=(ta.value?'\n\n':'')+'→ '+el.textContent+'\n';sv(key,ta.value);ta.focus();ta.scrollTop=ta.scrollHeight}el.closest('.relance').classList.remove('show');dSave()}
function clickR(btn,key,val){btn.parentElement.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');sv(key,val);dSave();updateProg()}

// ========== SAVE ==========
let _st;function dSave(){clearTimeout(_st);_st=setTimeout(save,600)}
function save(){document.querySelectorAll('[data-key]').forEach(el=>{if(el.tagName==='TEXTAREA'||el.tagName==='INPUT')sv(el.dataset.key,el.value)});D.meta.lastSaved=new Date().toISOString();localStorage.setItem(SK,JSON.stringify(D))}
function saveNow(){save();alert('Sauvegardé !')}
function confirmReset(){if(confirm('⚠️ Supprimer toutes les données ?')){if(confirm('Confirmation finale.')){localStorage.removeItem(SK);location.reload()}}}

function exportJSON(){
  save();const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=u;a.download=`Portefeuille_${(D.meta.nom||'x').replace(/\s+/g,'_')}_${new Date().toISOString().split('T')[0]}.json`;
  a.click();URL.revokeObjectURL(u);
}
function importJSON(){document.getElementById('f-imp').click()}
function handleImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{D=JSON.parse(ev.target.result);localStorage.setItem(SK,JSON.stringify(D));launch()}catch(er){alert('Fichier invalide.')}};r.readAsText(f)}

// ========== PROGRESS ==========
function countFilled(sec){
  let t=0,f=0;const chk=k=>{t++;if(gv(k))f++};
  if(sec.fields)sec.fields.forEach(fl=>chk(`${sec.id}__${fl.id}`));
  if(sec.sf)sec.sf.forEach(fl=>chk(`${sec.id}__${fl.id}`));
  if(sec.tags){t++;if(gv(`${sec.id}__tg__${sec.tags.id}`))f++}
  if(sec.dl){const entries=gList(sec.dl.id);const af=sec.dl.depths?sec.dl.depths.flatMap(d=>d.fields):sec.dl.fields;entries.forEach((_,i)=>af.forEach(fl=>chk(`${sec.dl.id}__${i}__${fl.id}`)));if(!entries.length)t++}
  return{t,f};
}
function updateProg(){
  let gt=0,gf=0;
  SEC.forEach((sec,idx)=>{const{t,f}=countFilled(sec);gt+=t;gf+=f;const ni=document.querySelectorAll('.ni')[idx];if(!ni)return;ni.classList.remove('done','wip');const ns=ni.querySelector('.ns');if(t>0&&f>=t){ni.classList.add('done');ns.textContent='✓'}else if(f>0){ni.classList.add('wip');ns.textContent='…'}else ns.textContent=''});
  const pct=gt>0?Math.round(gf/gt*100):0;
  const pf=document.getElementById('pg-f');const pl=document.getElementById('pg-l');
  if(pf)pf.style.width=pct+'%';if(pl)pl.textContent=pct+'%';
  updateInsights();
}

// ========== INSIGHTS ==========
function updateInsights(){
  const fr=analyzeFilRouge();
  ['synthese','persp','plan'].forEach(sid=>{const el=document.getElementById('fr-'+sid);if(!el)return;if(fr.themes.length){el.innerHTML=`<h3>🧶 Fil rouge</h3>${fr.narrative?`<div class="fr-item" style="font-style:italic;color:#555">${esc(fr.narrative)}</div>`:''}${fr.themes.map(t=>`<div class="fr-item"><strong>${t.th}</strong> <span style="color:var(--txtu);font-size:.85em">(${t.c}×)</span></div>`).join('')}`;el.style.display='block'}else el.style.display='none'});
  ['synthese','persp'].forEach(sid=>{const el=document.getElementById('ip-'+sid);if(!el)return;let items=[];if(fr.tags.length)items.push(`<div class="ip-item"><strong>Compétences & qualités :</strong> ${fr.tags.map(t=>`<span class="ip-kw">${esc(t)}</span>`).join(' ')}</div>`);if(items.length){el.innerHTML=`<h3>💡 Ce qui ressort</h3>${items.join('')}`;el.style.display='block'}else el.style.display='none'});
}

// ========== PDF ==========
async function exportPDF(){
  save();openModal('pdf-modal');const st=document.getElementById('pdf-st');st.textContent='Préparation…';await new Promise(r=>setTimeout(r,300));
  const z=document.getElementById('pdf-z');z.className='pz';const m=D.meta;let h='';
  const ctxL={salarie:'Salarié(e)',recherche:'Recherche d\'emploi',reconversion:'Reconversion',creation:'Création d\'activité',evolution:'Évolution interne',formation:'Formation / VAE',autre:'Autre'};
  h+=`<div class="pc"><h1>PORTEFEUILLE DE COMPÉTENCES</h1><p style="color:#888;font-size:12px;margin-bottom:20px">C Concept&Dev — Bilan de Compétences</p><div class="pm"><p style="font-size:14px;font-weight:700;color:#333;margin-bottom:5px">${esc(m.nom)}</p>${m.consultant?`<p style="color:#666">Consultant : ${esc(m.consultant)}</p>`:''}${m.date_debut?`<p style="color:#666">Période : ${fmtD(m.date_debut)} — ${fmtD(m.date_fin)}</p>`:''}${m.contexte?`<p style="color:#666">Contexte : ${ctxL[m.contexte]||m.contexte}</p>`:''}</div></div>`;
  h+=`<div class="ptoc"><h2>Sommaire</h2>${SEC.map((s,i)=>`<div class="pti">${i+1}. ${s.icon} ${s.title}</div>`).join('')}</div>`;
  const fr=analyzeFilRouge();
  if(fr.narrative){h+=`<div class="ps"><h2>🧶 Fil rouge — Synthèse</h2><div class="pnarr">${esc(fr.narrative)}</div>`;if(fr.tags.length)h+=`<div class="pf"><div class="pl">Compétences et qualités</div><div class="pv">${fr.tags.join(' • ')}</div></div>`;h+=`</div>`}

  SEC.forEach(sec=>{
    h+=`<div class="ps"><h2>${sec.icon} ${sec.title}</h2>`;
    if(sec.tags){const t=(gv(`${sec.id}__tg__${sec.tags.id}`)||'').split('||').filter(Boolean);if(t.length)h+=`<div class="pf"><div class="pl">${sec.tags.title}</div><div class="pv">${t.join(' • ')}</div></div>`}
    if(sec.fields)sec.fields.forEach(f=>{const v=gv(`${sec.id}__${f.id}`);if(v)h+=`<div class="pf"><div class="pl">${f.label}</div><div class="pv">${escBr(v)}</div></div>`});
    if(sec.sf)sec.sf.forEach(f=>{const v=gv(`${sec.id}__${f.id}`);h+=`<div class="pf"><div class="pl">${f.label}</div><div class="pv">${escBr(v)||'<em style="color:#ccc">—</em>'}</div></div>`});
    if(sec.dl){
      const dl=sec.dl;const entries=gList(dl.id);
      if(!entries.length)h+=`<p style="color:#bbb;font-size:10px;font-style:italic">Aucune entrée.</p>`;
      entries.forEach((_,i)=>{
        const et=(gv(`_tg_${dl.id}_${i}`)||'').split(',').filter(Boolean);
        h+=`<div class="pe"><div class="pet">${dl.et} n°${i+1}`;
        if(et.length)h+=` <span style="font-size:9px;color:#888">${et.map(t=>({imp:'★ Important',deep:'⊕ Approfondir',keep:'✓ Garder'}[t]||t)).join(' | ')}</span>`;
        h+=`</div>`;
        const af=dl.depths?dl.depths.flatMap(d=>d.fields):dl.fields;
        af.forEach(f=>{const v=gv(`${dl.id}__${i}__${f.id}`);if(v)h+=`<div class="pf"><div class="pl">${f.label}${f.type==='rome'?' (ROME)':''}</div><div class="pv">${escBr(v)}</div></div>`});
        // Docs
        const docsKey=`_docs_${dl.id}_${i}`;
        if(D.data[docsKey]){const docs=JSON.parse(D.data[docsKey]);if(docs.length)h+=`<div class="pdocs">📎 Documents joints : ${docs.map(d=>d.name).join(', ')}</div>`}
        h+=`</div>`;
      });
    }
    h+=`</div>`;
  });
  h+=`<div class="pfr">Portefeuille de Compétences — ${esc(m.nom)} — C Concept&Dev — ${new Date().toLocaleDateString('fr-FR')}</div>`;
  z.innerHTML=h;st.textContent='Génération…';await new Promise(r=>setTimeout(r,200));
  try{await html2pdf().set({margin:[10,10,15,10],filename:`Portefeuille_${(m.nom||'x').replace(/\s+/g,'_')}.pdf`,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css','legacy']}}).from(z).save();st.textContent='PDF généré !';await new Promise(r=>setTimeout(r,1200))}catch(e){st.textContent='Erreur.';console.error(e);await new Promise(r=>setTimeout(r,2000))}
  closeModal('pdf-modal');z.innerHTML='';
}

// ========== INIT ==========
window.addEventListener('DOMContentLoaded',()=>{
  const s=localStorage.getItem(SK);
  if(s){try{const d=JSON.parse(s);if(d?.meta?.nom){D=d;showResume();return}}catch(e){}}
  showScr('S_setup');
});
